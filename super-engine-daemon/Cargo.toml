[package]
    name = "super-engine-daemon"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "The parts of a Super STT or Super TTS daemon that do not depend on the product"
    license.workspace = true
    repository.workspace = true

[dependencies]
    anyhow.workspace = true
    axum = {
        version = "0.8",
        default-features = false,
        features = ["json", "tokio"]
    }
    # Frequency bands ride base64-encoded in their event.
    base64 = "0.22.1"
    # Unpacking a subprocess backend's release tarball.
    flate2 = "1.1.9"
    chrono.workspace = true
    futures-util.workspace = true
    # CUDA, ROCm and Vulkan detection, for picking the build a host can run.
    gpu-probe = "0.1.1"
    hex = "0.4.3"
    # Reading out the body of a request refused before its handler.
    http-body-util = "0.1"
    hyper = { version = "1", features = ["http1", "server"] }
    hyper-util = {
        version = "0.1",
        features = ["http1", "server", "service", "tokio"]
    }
    keyring.workspace = true
    libc.workspace = true
    log.workspace = true
    parking_lot = "0.12"
    reqwest.workspace = true
    # Session tokens are drawn from the system's secure random source, and
    # downloads hashed as they stream.
    ring = "0.17"
    semver = "1"
    serde.workspace = true
    serde_json.workspace = true
    super-engine-forge = { path = "../super-engine-forge" }
    super-engine-protocol = { path = "../super-engine-protocol" }
    super-engine-spec = { path = "../super-engine-spec" }
    tar = "0.4.46"
    thiserror.workspace = true
    tokio = {
        workspace = true,
        features = [
            "fs",
            "io-util",
            "macros",
            "net",
            "process",
            "rt-multi-thread",
            "sync",
            "time",
        ]
    }
    # Every daemon publishes an `OpenAPI` document, and the auth routes carry
    # their own `#[utoipa::path]`, so this is not optional.
    tokio-stream = "0.1.18"
    tokio-util = "0.7"
    utoipa.workspace = true
    # The id each `/events` subscription is acknowledged with.
    uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
    bytes = "1"
    mockito = "1.7.2"
    # The product the registry tests parse manifests and indexes for.
    super-engine-spec = { path = "../super-engine-spec", features = ["test-product"] }
    tempfile = "3.27.0"
    # `ServiceExt::oneshot`, to run a guard as a router would.
    tower = { version = "0.5", features = ["util"] }

[lints]
    workspace = true
