[package]
    name = "super-engine-client"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "A client of a daemon built on super-engine"
    license.workspace = true
    repository.workspace = true

[dependencies]
    async-stream = "0.3.6"
    futures-util.workspace = true
    http-body-util = "0.1"
    hyper = { version = "1", features = ["client", "http1"] }
    hyper-util = {
        version = "0.1",
        features = ["client", "client-legacy", "http1", "tokio"]
    }
    log.workspace = true
    serde.workspace = true
    serde_json.workspace = true
    super-engine-protocol = { path = "../super-engine-protocol" }
    # `fs::write_atomic_private`, for the session token each client keeps.
    super-engine-spec = { path = "../super-engine-spec" }
    thiserror.workspace = true
    tokio = {
        workspace = true,
        features = [
            "macros",
            "net",
            "rt-multi-thread",
            "time",
        ]
    }

[dev-dependencies]
    # Test directories that remove themselves.
    tempfile = "3.27.0"
    # The made-up products the tests talk to.
    super-engine-protocol = {
        path = "../super-engine-protocol",
        features = ["test-product"]
    }

[lints]
    workspace = true
