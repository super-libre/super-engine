[workspace]
  resolver = "2"
  members  = [
    "super-engine-client",
    "super-engine-daemon",
    "super-engine-forge",
    "super-engine-indexer",
    "super-engine-protocol",
    "super-engine-spec",
  ]

  [workspace.package]
    version    = "0.1.0"
    authors    = ["Jorge Menjivar <jorge@menjivar.ai>"]
    edition    = "2024"
    license    = "GPL-3.0-only"
    repository = "https://github.com/super-libre/super-engine"

  [workspace.dependencies]
    anyhow       = "1.0.100"
    chrono       = { version = "0.4", features = ["serde"] }
    dirs         = "6.0.0"
    env_logger   = "0.11.8"
    futures-util = "0.3.31"
    # Both native backends are named because the clients build for both
    # platforms. Neither costs the other anything: keyring puts
    # `dbus-secret-service` behind `cfg(target_os = "linux")` and
    # `security-framework` behind `cfg(target_os = "macos")`, so each feature
    # pulls a dependency only on the target that uses it. Without
    # `apple-native` keyring falls back to its *mock* store on macOS, which
    # would silently drop every session token at exit.
    keyring      = {
      version  = "3",
      features = [
        "apple-native",
        "sync-secret-service",
      ]
    }
    libc         = "0.2"
    log        = "0.4.29"
    reqwest    = {
      version          = "0.13.2",
      default-features = false,
      features         = [
        "json",
        "multipart",
        "rustls-no-provider",
        "stream",
      ]
    }
    serde      = { version = "1.0.219", features = ["derive"] }
    serde_json = "1.0.149"
    strum        = { version = "0.28.0", features = ["derive"] }
    strum_macros = "0.28"
    thiserror  = "2.0"
    tokio      = {
      version  = "1.49.0",
      features = [
        "full",
        "macros",
        "net",
        "rt-multi-thread",
        "time",
      ]
    }
    toml       = "1.0.6"
    # OpenAPI: the daemons generate their protocol spec from the router and the
    # wire types, so the types here derive `ToSchema` behind an `openapi`
    # feature rather than being described a second time.
    utoipa     = { version = "5.5.0", features = ["axum_extras", "chrono"] }

  [workspace.lints.clippy]
    pedantic = { level = "warn", priority = -1 }

  # Mirrors the clippy gate (see `just check`) so `cargo clippy` / `cargo build`
  # apply the same standard as CI.
  [workspace.lints.rust]
    unused_must_use = "deny"
