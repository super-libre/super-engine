[package]
    name = "super-engine-indexer"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Builds a product's backend registry index from registry.toml and forge releases"
    license.workspace = true
    repository.workspace = true

[dependencies]
    anyhow.workspace = true
    chrono.workspace = true
    clap = { version = "4.5.54", features = ["derive"] }
    env_logger.workspace = true
    flate2 = "1"
    futures = "0.3"
    hex = "0.4"
    log.workspace = true
    reqwest.workspace = true
    ring = "0.17"
    semver = "1"
    serde_json.workspace = true
    super-engine-forge = { path = "../super-engine-forge" }
    super-engine-spec = { path = "../super-engine-spec" }
    tar = "0.4"
    thiserror.workspace = true
    tokio.workspace = true
    toml.workspace = true

[dev-dependencies]
    mockito = "1"
    # The made-up product the tests index backends for.
    super-engine-spec = { path = "../super-engine-spec", features = ["test-product"] }
    tempfile = "3"

[lints]
    workspace = true
