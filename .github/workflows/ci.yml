name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # A job of its own, needing no system libraries or cache, so a formatting
  # slip fails in seconds and does not stop clippy and the tests reporting.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: just fmt-check

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: just

      # The session store reaches the Secret Service through keyring's
      # `sync-secret-service`, which links libdbus.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keyed on the rustc version as well as Cargo.lock. Cargo throws away a
      # target directory an older stable built, and a key on the lockfile
      # alone kept restoring one without ever saving a fresh one. Saved from
      # main only; a pull request restores main's.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The rest of `just ci`, a step per check so the job's page shows which
      # one failed and how long each took.
      - name: Run clippy
        run: just check

      - name: Run tests
        run: just test

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: just

      # No system dependencies to install: the Security framework the session
      # store uses ships with the OS.

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The runtime-directory code has a macOS arm of its own (the Darwin
      # per-user temp directory), so clippy and the tests run here too.
      - name: Run clippy
        run: just check

      - name: Run tests
        run: just test
