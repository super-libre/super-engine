# SPDX-License-Identifier: GPL-3.0-only
name: Build registry index

# Builds a product's registry index.json and publishes it, with the registry
# JSON schemas, to the product's gh-pages branch.
#
# A product calls this from its own build-index.yml, which owns the triggers
# (a schedule, and pushes that touch the registry) and the concurrency group,
# and grants `contents: write` for the gh-pages push:
#
#   jobs:
#     build:
#       uses: super-libre/super-engine/.github/workflows/build-index.yml@<rev>
#       with:
#         indexer: super-stt-indexer
#         registry-types: super-stt-registry-types
#
# Pin <rev> to the same super-engine rev as the product's Cargo.toml.

on:
  workflow_call:
    inputs:
      indexer:
        description: The product's indexer package. Its binary has the same name.
        type: string
        required: true
      registry-types:
        description: The product's registry types package. Its gen_schemas binary writes the schemas.
        type: string
        required: true

permissions:
  contents: write   # to push to gh-pages branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: src

      - name: Checkout gh-pages (for prior index)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: pages

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: build-index-${{ hashFiles('src/Cargo.lock') }}

      - name: Build indexer
        working-directory: src
        env:
          INDEXER: ${{ inputs.indexer }}
        run: cargo build --release -p "$INDEXER"

      - name: Run indexer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEXER: ${{ inputs.indexer }}
        run: |
          mkdir -p out
          "src/target/release/$INDEXER" build \
            --registry src/registry/registry.toml \
            --prior-index pages/index.json \
            --out out/index.json

      - name: Generate schemas
        working-directory: src
        env:
          REGISTRY_TYPES: ${{ inputs.registry-types }}
        run: cargo run -p "$REGISTRY_TYPES" --features schema --bin gen_schemas

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Publish from a clean directory so this step never depends on what
          # the best-effort `gh-pages` checkout above left behind. A failed
          # first-run checkout leaves a partial repo on the default branch,
          # which previously made the commit land on `master` and the
          # `gh-pages` push fail with "src refspec gh-pages does not match any".
          rm -rf publish && mkdir publish && cd publish
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # Build the new commit on top of the current gh-pages tip when it
          # exists (fast-forward push, preserves any other published files);
          # on the first run the branch is unborn and this becomes the root.
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git reset --hard -q FETCH_HEAD
          fi
          cp ../out/index.json index.json
          cp ../src/target/schemas/*.json .
          git add -A
          if git diff --cached --quiet; then
            echo "index.json and schemas unchanged; nothing to publish"
            exit 0
          fi
          git -c user.name=actions -c user.email=actions@github.com \
              commit -q -m "Update index.json + schemas ($GITHUB_SHA)"
          git push origin gh-pages
