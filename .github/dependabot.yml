version: 2
updates:
  # The shared product workflows and actions live here too, so a bump of the
  # actions they use lands once, for every product that pins this repo.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    target-branch: "main"
    # Minor and patch bumps land together, one PR a week rather than one per
    # action, each with a CI run of its own. A major arrives as its own PR: it
    # can change what a workflow does, and red in the group it would hold back
    # every routine bump behind it.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Crates get security PRs only: a limit of 0 keeps version updates off, and
  # this entry shapes the security PRs. It sets no `target-branch`, because an
  # entry that sets one no longer applies to security updates.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # wasmtime, wasmtime-wasi and wasmtime-wasi-http require each other within
    # one major version. Bumping one alone across a major pulls in a second
    # wasmtime whose types don't match, so the build breaks. Within a major
    # they resolve, and they move together in one PR.
    groups:
      wasmtime:
        applies-to: "security-updates"
        patterns:
          - "wasmtime*"
    # Majors are ignored. 48 is an LTS line with security fixes until August
    # 2028, so a fix arrives as a 48.0.x patch. The move to the next LTS (60)
    # is made by hand.
    ignore:
      - dependency-name: "wasmtime*"
        update-types:
          - "version-update:semver-major"
